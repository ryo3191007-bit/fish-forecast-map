name: Issue 300 Debug

on:
  pull_request:
    branches: [main]

jobs:
  detail-ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Issue 300 unified detail items
        run: npm run test:issue-300-unified-detail-items
      - name: Existing spot evaluation card
        run: npm run test:spot-evaluation-card
