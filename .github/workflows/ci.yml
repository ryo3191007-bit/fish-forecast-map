name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/issue-329-fish-ecology-inventory.mjs --print
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
