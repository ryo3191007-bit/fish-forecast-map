name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/issue-329-fish-ecology-inventory.mjs --check
      - run: npm run lint
      - run: npm run typecheck
      - name: Run tests with diagnostic log
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-333-npm-test-log
          path: npm-test.log
      - run: npm run build